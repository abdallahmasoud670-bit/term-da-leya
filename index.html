  Q('Final 2018',4,'Q3: mean weekly wages: 15 employees average $1,035; 20 employees of another company average $1,090. Combined mean for the 35 employees?',
   'Weighted mean = (15 x 1035 + 20 x 1090)/35 = (15,525 + 21,800)/35 = 37,325/35 = $1,066.43.'),
  Q('Final 2018',5,'Q5: the waiting times are normal with unknown mean and sd; a student observes n = 45 customers. Find the probability that the sample standard deviation exceeds 5 minutes when the population standard deviation is 6.0.',
   'Use the chi-square distribution of the sample variance: chi2 = (n - 1)s^2/sigma^2 = 44 x 25/36 = 30.56 with df = 44.\nP(s > 5) = P(chi2 > 30.56). The chi-square tables do not list df = 44 exactly; with the normal approximation to the chi-square the probability is about 0.94.'),
  Q('Final 2018',6,'Q6 (Ball bearings): the machine should give a variance of diameters of 0.025 mm^2 or less. A sample of 23 bearings gave a variance of 0.034. Using 5%, does the machine need adjustment?',
   'H0: sigma^2 <= 0.025, H1: sigma^2 > 0.025 (right-tailed chi-square test, df = 22).\nchi2 = (n - 1)s^2/sigma0^2 = 22 x 0.034/0.025 = 29.92.\nCritical value chi2(0.05, 22) = 33.924. 29.92 < 33.924, so fail to reject H0: not enough evidence that the variance exceeds 0.025, so the machine does not need adjustment.'),
  Q('Final 2018',7,'Q5 (roulette): a casino player watched 430 spins; the ball landed on 0 or 00 14 times. (a) Point estimate of the proportion? (b) 95% CI? (c) If all slots are the same size the ball should land on 0/00 5.26% of the time: is the player\'s suspicion reasonable?',
   '(a) p = 14/430 = 0.0326. (b) SE = sqrt(0.0326 x 0.9674/430) = 0.00856. CI = 0.0326 +/- 1.96 x 0.00856 = [0.0158, 0.0493]. (c) The value 5.26% is above the upper limit 4.93%, so the true proportion is probably below 5.26%: yes, the suspicion that 0 and 00 occur less often is reasonable.'),
  Q('Final 2018',8,'Q7: accounting clerks: n = 16, mean $26,400, s = $1,200; data entry operators: n = 14, mean $25,800, s = $1,050. At alpha = 0.10, is the population variance of salaries the same for both?',
   'H0: sigma1^2 = sigma2^2, H1: not equal (two-tailed F test, df = (15, 13)). F = 1200^2/1050^2 = 1.306.\nCritical values at 0.05 in each tail: upper F(0.05; 15, 13) = 2.53 and lower = 1/F(0.05; 13, 15) = 1/2.48 = 0.40 (table values).\n1.306 is between 0.40 and 2.53, so fail to reject H0: the variances can be taken as equal.'),
  Q('Final 2018',9,'Q8: 400 marketing managers (220 keep track "in their head") and 450 accountants (216 do). At 1%, is the proportion of accountants smaller?',
   'H0: pi_A >= pi_M, H1: pi_A < pi_M (left-tailed two-proportion z test). p_M = 0.55, p_A = 0.48, pooled p-bar = 436/850 = 0.513.\nz = (0.48 - 0.55)/sqrt(0.513 x 0.487 x (1/450 + 1/400)) = -0.07/0.03435 = -2.04. Critical z = -2.326.\n-2.04 is not below -2.326, so fail to reject H0 at 1%: not enough evidence that a smaller proportion of accountants do this (it would be significant at 5%).'),
  Q('Final 2018',10,'Q9: nine employees, cholesterol Before = 255, 230, 290, 225, 300, 250, 215, 230, 225 and After = 200, 225, 215, 250, 240, 235, 190, 240, 200. 98% CI for the mean difference, interpret.',
   'd = Before - After = 55, 5, 75, -25, 60, 15, 25, -10, 25. Mean = 25, s_d = 33.26, SE = 33.26/3 = 11.09. t(0.01, 8) = 2.896, margin = 32.1.\nCI = [-7.1, 57.1]. It contains 0, so the diet did not produce a significant reduction at 98% confidence.'),
  Q('Final 2020',1,'Q6: the conduction time of a prototype: n = 18 trials, mean 334.8 ns, s = 6.3 ns. (a) 95% CI for the true standard deviation. (b) Low jitter means sigma < 7 ns: does the prototype satisfy it?',
   '(a) df = 17: chi2(0.025) = 30.191 and chi2(0.975) = 7.564. (n - 1)s^2 = 17 x 39.69 = 674.7. Variance CI = [674.7/30.191, 674.7/7.564] = [22.35, 89.20]; standard deviation CI = [4.73, 9.44] ns. (b) The limit 7 is inside the interval, so we cannot conclude that sigma is below 7: the requirement is not proven.'),
  Q('Final 2020',2,'Q7: two post offices: Town A (n = 80, mean 28.55 cards, s = 10.30) and Town B (n = 58, mean 33.67, s = 8.97), equal population standard deviations. At 10%, is the average number of cards different?',
   'Pooled t test: s_p = sqrt((79 x 10.3^2 + 57 x 8.97^2)/136) = 9.765. H0: mu_A = mu_B, H1: not equal; df = 136, critical t = +/- 1.656.\nt = (28.55 - 33.67)/(9.765 x sqrt(1/80 + 1/58)) = -5.12/1.684 = -3.04. |t| > 1.656, so reject H0: the average number of New Year cards is different in the two towns (Town B mails more).'),
  Q('Final 2020',3,'Q8: Trail Making Test: schizophrenics n = 41, s = 45.45; normal subjects n = 31, s = 16.34. Using a 98% CI is there evidence that schizophrenics have more variability?',
   'F = s1^2/s2^2 = 45.45^2/16.34^2 = 7.74 with df (40, 30). 98% CI for the ratio of variances: [7.74/F(0.01; 40, 30), 7.74 x F(0.01; 30, 40)] with F(0.01; 40, 30) about 2.30 and F(0.01; 30, 40) about 2.20, so about [3.4, 17.0].\nThe interval is entirely above 1, so yes: schizophrenics have a larger variance (wider range) than normal subjects.'),
  Q('Final 2020',4,'Q9: 1,024 subcarrier signals: 672 data, 256 pilot, 96 null. (a) Estimate the proportion of data subcarriers. (b) Test at 0.05 that fewer than 70% of all signals are data subcarriers.',
   '(a) p = 672/1024 = 0.656. (b) H0: pi >= 0.70, H1: pi < 0.70 (left-tailed z). z = (0.656 - 0.70)/sqrt(0.7 x 0.3/1024) = -0.0438/0.01432 = -3.06 < -1.645: reject H0. There is evidence that fewer than 70% of the signals are data subcarriers.'),
  Q('Final 2020',5,'Q10: nine contestants: first pie = 49, 59, 66, 49, 63, 70, 77, 59, 65; last pie = 49, 74, 92, 93, 91, 73, 103, 59, 85. 95% CI for the mean paired difference (last - first) and conclusion.',
   'd = last - first = 0, 15, 26, 44, 28, 3, 26, 0, 20. Mean = 18, s_d = 14.96, SE = 4.99. t(0.025, 8) = 2.306, margin = 11.50.\nCI = [6.5, 29.5] seconds. It is entirely above 0, so on average it takes longer to eat the last pie than the first one.'),
  Q('Final 2021',3,'Q3: laundromat times (15 weeks): 75, 62, 84, 73, 107, 81, 93, 72, 135, 77, 85, 67, 90, 83, 112. Box-and-whisker plot, skewness, outliers.',
   'Sorted: 62, 67, 72, 73, 75, 77, 81, 83, 84, 85, 90, 93, 107, 112, 135 (n = 15).\nQ1: position 0.25 x 15 = 3.75, round up to 4: Q1 = 73. Median (position 8, the middle): 83. Q3: position 11.25, round up to 12: Q3 = 93.\nIQR = 20; limits: 73 - 30 = 43 and 93 + 30 = 123. 135 is above 123: it is an outlier. Whiskers go from 62 to 112.\nThe median (83) is closer to Q1 and the upper tail is long: right skewed (the mean is about 86.6).'),
  Q('Final 2021',4,'Q4: 80 adults, credit cards: 0-<4 (18), 4-<8 (26), 8-<12 (22), 12-<16 (11), 16-<20 (3). (a) Is the number of classes appropriate? (b) Percentage with 12 or more? (c) Mean, range, standard deviation.',
   '(a) Use 2^k >= n: 2^6 = 64 < 80 <= 128 = 2^7, so k should be 7 classes; 5 classes is a bit few (acceptable but not the rule). (b) (11 + 3)/80 = 17.5%. (c) Midpoints 2, 6, 10, 14, 18. Mean = (36 + 156 + 220 + 154 + 54)/80 = 620/80 = 7.75. Range (as taught) = 18 - 2 = 16 (or 20 - 0 = 20 using the class limits). SS = sum f(m - mean)^2 = 1,531, so s = sqrt(1531/79) = 4.40.'),
  Q('Final 2021',5,'Q5: the population standard deviation of cars per day is 170. How many days must be observed to be 99% certain the estimate is within 100 cars?',
   'n = (z x sigma/e)^2 = (2.576 x 170/100)^2 = 4.379^2 = 19.18, round up to 20 days.'),
  Q('Final 2021',6,'Q6 and Q7: 15% of homeowners pay more than $2,500 with sd $350: the mean? Then 16 workers: Yes = 5 of 16 would accept a 3% pay cut for 2 more weeks of vacation: 97% CI for the percentage.',
   'Mortgage: z = 1.036, so mu = 2500 - 1.036 x 350 = $2,137.4.\nWorkers: p = 5/16 = 0.3125, SE = sqrt(0.3125 x 0.6875/16) = 0.1159; z(0.015) = 2.17. CI = 0.3125 +/- 2.17 x 0.1159 = [0.061, 0.564], i.e. between 6.1% and 56.4% (very wide because n = 16).'),
  Q('Final 2021',7,'Q8: saltwater quenching n = 10, s = 4.971 vs oil quenching n = 10, s = 5.461. 95% CI for the ratio of the variances and conclusion.',
   'Ratio = 4.971^2/5.461^2 = 24.71/29.82 = 0.829. With df (9, 9): F(0.025; 9, 9) = 4.03. CI = [0.829/4.03, 0.829 x 4.03] = [0.206, 3.34].\nThe interval contains 1, so the variances can be taken as equal (no evidence that the two processes differ in variability).'),
  Q('Final 2021',8,'Q9: pancake mix: sample variance 1.47 g^2 from 24 cups. 98% CI for the population variance and the standard deviation.',
   'df = 23: chi2(0.01) = 41.638 and chi2(0.99) = 10.196. (n - 1)s^2 = 23 x 1.47 = 33.81.\nVariance CI = [33.81/41.638, 33.81/10.196] = [0.812, 3.316] g^2. Standard deviation CI = [0.90, 1.82] g.\n(The table values for df 23 are chi2(0.01) = 41.638 and chi2(0.99) = 10.196.)'),
  Q('Final 2021',9,'Q10: nine students memory scores Before = 43, 57, 48, 65, 81, 49, 38, 69, 58 and After = 49, 56, 55, 77, 89, 58, 36, 64, 69. 95% CI for the mean difference (after - before) and the conclusion.',

 ]);
 MCQB.stat.push(
  ['A chi-square test for a single variance uses the statistic:','(n - 1)s^2 / sigma0^2 with df = n - 1',['(x-bar - mu)/(s/sqrt n)','s1^2/s2^2','(p - pi)/sqrt(pq/n)'],'Finals 2018 and 2020.'],
  ['The number of classes k in a frequency table is chosen from:','2^k >= n',['k = n','k = n/2','k = sqrt(range)'],'For n = 80 this gives k = 7.'],

/* Stat 2: Final 2019 (all 3 pages) and the remaining pages of Final 2022 (pp 6-7; p 8 is the formula sheet). Solved by hand, numbers checked with a calculator. Final 2019 gives its own table hints on the exam. */
(function(){
 const Q=(s,n,q,a)=>({s,n,p:0,q,a,u:'stat'});
 EXB.stat=(EXB.stat||[]).concat([
  Q('Final 2019',3,'Q1a: show that x-bar is an unbiased estimator of mu and that S^2 = (1/(n-1)) sum (x_i - x-bar)^2 is an unbiased estimator of sigma^2.',
   'E(x-bar) = (1/n) sum E(x_i) = (1/n) x n x mu = mu, so x-bar is unbiased.\nFor S^2: sum (x_i - x-bar)^2 = sum x_i^2 - n x-bar^2. E(x_i^2) = sigma^2 + mu^2 and E(x-bar^2) = sigma^2/n + mu^2. So E[sum (x_i - x-bar)^2] = n(sigma^2 + mu^2) - n(sigma^2/n + mu^2) = (n - 1) sigma^2. Dividing by (n - 1) gives E(S^2) = sigma^2: unbiased (this is why we divide by n - 1).'),
  Q('Final 2019',4,'Q2: ATM transactions last month. Under 25: 10, 10, 11, 15, 7, 11, 10, 9. Over 60: 4, 8, 7, 7, 7, 4, 5, 4, 7, 4, 6, 5. (i) At 95% test H0: mu1 = mu2 vs H1: mu1 not equal mu2. (ii) 95% CI for the difference.',
   'Under 25: n = 8, mean 10.375, s = 2.264. Over 60: n = 12, mean 5.667, s = 1.497.\nUnequal-looking spreads, but the formula sheet gives the pooled t, so assume equal variances: s_p = sqrt((7 x 5.125 + 11 x 2.242)/18) = 1.834, SE = 1.834 x sqrt(1/8 + 1/12) = 0.837.\n(i) t = (10.375 - 5.667)/0.837 = 5.62 with df = 18. The exam hint: t(18, 0.025) = 2.101. 5.62 > 2.101, so reject H0: the mean number of ATM transactions differs; young adults use ATMs more.\n(ii) CI = 4.708 +/- 2.101 x 0.837 = 4.708 +/- 1.759 = [2.95, 6.47]. It does not contain 0.'),
  Q('Final 2019',5,'Q3: grams of solids removed (y) vs drying time (x), 10 observations: y = 3, 5, 4, 6, 5, 5, 6, 7, 7, 8 and x = 2, 3, 4, 4, 4, 5, 5, 6, 6, 7. (a) Correlation and comment. (b) Fit y = ax + b. (c) Estimate of the mean grams of solids removed at 9 hours.',
   'Sums: sum x = 46, sum y = 56, sum xy = 276, sum x^2 = 232, sum y^2 = 334, n = 10.\n(a) r = (n sum xy - sum x sum y)/sqrt((n sum x^2 - (sum x)^2)(n sum y^2 - (sum y)^2)) = (2760 - 2576)/sqrt((2320 - 2116)(3340 - 3136)) = 184/sqrt(204 x 204) = 184/204 = 0.902. A strong positive linear relationship: more drying time, more solids removed.\n(b) a = (n sum xy - sum x sum y)/(n sum x^2 - (sum x)^2) = 184/204 = 0.902; b = sum y/n - a x sum x/n = 5.6 - 0.902 x 4.6 = 1.451. So y = 0.902x + 1.451.\n(c) y(9) = 0.902 x 9 + 1.451 = 9.57 grams. Caution: 9 hours is outside the observed range of x (2 to 7), so this is an extrapolation.'),
  Q('Final 2019',6,'Q4a: ten individuals in a diet-modification program. Before = 195, 213, 247, 201, 187, 210, 215, 246, 294, 310; After = 187, 195, 221, 190, 175, 197, 199, 221, 300, 285. Is there evidence at 0.05 that the program is effective in producing a mean weight reduction?',
   'Paired t test. d = Before - After = 8, 18, 26, 11, 12, 13, 16, 25, -6, 25. Mean = 14.8, s_d = 9.716, SE = 3.072.\nH0: mu_d <= 0, H1: mu_d > 0 (right-tailed), df = 9: the exam hint gives t(9, 0.05) = 1.833.\nt = 14.8/3.072 = 4.82 > 1.833, so reject H0: the program is effective in reducing weight.'),
  Q('Final 2019',7,'Q4b: x1, ..., xn is a random sample from f(x; theta) = (1/theta) e^(-x/theta), x > 0. Find the maximum likelihood estimator of theta.',
   'Likelihood L = prod (1/theta) e^(-x_i/theta) = theta^(-n) exp(-sum x_i/theta).\nln L = -n ln(theta) - (sum x_i)/theta. Differentiate: d ln L/d theta = -n/theta + (sum x_i)/theta^2 = 0, so theta-hat = (sum x_i)/n = x-bar.\n(The second derivative is negative at this value, so it is a maximum.) The MLE of theta is the sample mean.'),
  Q('Final 2019',8,'Q5: a company operates three machines in three shifts: breakdowns shift 1 = 10, 15, 13; shift 2 = 14, 8, 8; shift 3 = 15, 10, 7 (totals 38, 30, 32; machine totals 39, 33, 28; total 100). Test at 0.05 that breakdowns are independent of the shift.',
   'H0: breakdowns are independent of the shift. E = row total x column total/100: shift 1: 14.82, 12.54, 10.64; shift 2: 11.70, 9.90, 8.40; shift 3: 12.48, 10.56, 8.96.\nchi2 = sum (O - E)^2/E = (1.57 + 0.48 + 0.52) + (0.45 + 0.37 + 0.02) + (0.51 + 0.03 + 0.43) = 4.38. df = (3 - 1)(3 - 1) = 4.\nThe exam hint: chi2(4, 0.05) = 9.49. 4.38 < 9.49, so fail to reject H0: breakdowns are independent of the shift.'),
  Q('Final 2022',6,'Problem 7 MCQs: of 265 female students 131 are seriously thinking about graduate school and of 233 male students 130. Conclusion according to a 95% CI for the difference of proportions.',
   'Point estimates: p_F = 0.4943, p_M = 0.5579, difference p_M - p_F = 0.0636. SE of the difference = sqrt(0.5579 x 0.4421/233 + 0.4943 x 0.5057/265) = 0.0447. Critical z = 1.96.\nCI = 0.0636 +/- 1.96 x 0.0447 = [-0.0236, 0.1516] (option d on the exam). It contains 0, so we conclude that the proportions of male and female students are not significantly different (no evidence of a difference).'),
  Q('Final 2022',7,'Problem 8: sandpaper particles: n = 30, mean 12 micrometers, variance 2.13. The manufacturer wants the variability not to exceed 2.0. Can this be supported at the 95% confidence level?',
   'CI for the variance with df = 29: chi2(0.025) = 45.722 and chi2(0.975) = 16.047. (n - 1)s^2 = 29 x 2.13 = 61.77.\nCI = [61.77/45.722, 61.77/16.047] = [1.351, 3.849] (option b). The value 2.0 is inside the interval, so we cannot say that the variability exceeds 2.0: the conclusion is that the variability does not exceed 2.0 um (option d). (The wrong critical value 1.96 or 2.045 is the z/t trap: a variance CI uses chi-square.)'),
  Q('Final 2022',8,'Problem 9: 25 students took the HPI conscientiousness test. 15 undergraduates: mean 135, sd 21. 10 graduates: mean 153, sd 16. Equal variances. At 5%, do graduate students score higher on average?',
   'H0: mu_G - mu_UG <= 0, H1: mu_G - mu_UG > 0 (right-tailed pooled t test, df = 23): critical t = 1.714.\ns_p^2 = (14 x 441 + 9 x 256)/23 = 328.39 and s_p = 18.122 (so 328.391 is the pooled variance). SE = 18.122 x sqrt(1/15 + 1/10) = 7.398.\nt = (153 - 135)/7.398 = 2.433 > 1.714: significant (p-value about 0.01). The mean HPI score of graduate students is significantly higher than that of undergraduates.')
 ]);
 MCQB.stat.push(
  ['The maximum likelihood estimator of theta for f(x) = (1/theta) exp(-x/theta) is:','The sample mean x-bar',['The sample median','n/sum x','max(x)'],'Final 2019.'],
  ['In a simple linear regression the correlation coefficient r = 0.90 means:','A strong positive linear relationship',['A weak relationship','A negative relationship','No relationship'],'Final 2019, Question 3.'],
  ['Predicting y at x = 9 when the data cover x from 2 to 7 is called:','Extrapolation (use with caution)',['Interpolation','A confidence interval','A hypothesis test'],'The line may not hold outside the observed range.'],
  ['The pooled variance for samples (n1 = 15, s1 = 21) and (n2 = 10, s2 = 16) is:','328.4',['448.5','256','441'],'(14 x 441 + 9 x 256)/23.'],
  ['The critical value used in the CI for a variance (df = 29, 95%) is:','16.047 and 45.722',['1.96','2.045','16.791 and 46.979'],'Final 2022, problem 8.'],
  ['The chi-square test of independence for a 3 x 3 table has df =','4',['9','3','8'],'(3 - 1)(3 - 1).']
 );
})();

/* =====================================================================
   GPA — حاسبة المعدل (لائحة 2024): معدل الترم، التراكمي، الدرجة المطلوبة، مستشار الإعادة

const GSCALE=[['A+',4.0,96],['A',3.7,92],['A-',3.4,88],['B+',3.2,84],['B',3.0,80],['B-',2.8,76],['C+',2.6,72],['C',2.4,68],['C-',2.2,64],['D+',2.0,60],['D',1.5,55],['D-',1.0,50],['F',0,0]];
const gLetterOf = m => { for(const r of GSCALE) if(m>=r[2]) return r; return GSCALE[12]; };
const gParse = s => {                       // حرف أو درجة -> {l,p,m} أو null
  s=String(s==null?'':s).trim().toUpperCase().replace(/\s+/g,''); if(!s) return null;
  const r=GSCALE.find(x=>x[0]===s); if(r) return {l:r[0],p:r[1],m:r[0]==='F'?null:r[2]};
  if(/^\d+(\.\d+)?$/.test(s)){ const m=+s; if(m>100) return null; const q=gLetterOf(m); return {l:q[0],p:q[1],m}; }
  return null;
};
const gPL = p => (GSCALE.find(r=>Math.abs(r[1]-p)<1e-6)||['?'])[0];
const gR2 = x => Math.round((x+1e-9)*100)/100;
function gpaDefault(){
  const c=(n,h,g)=>({n,h,g:String(g)});
  return {v:1,rt:3.0,tgt:3.0,tmode:'cum',terms:[
    {id:'t1',n:'ترم 1 (سنة أولى)',c:[c('Technical Report Writing',2,70),c('Discrete Math',3,70),c('Creative Thinking',2,87),c('Electronics',3,68),c('Fundamentals of CS',3,71),c('Math-0',0,78)]},
    {id:'t2',n:'ترم 2 (سنة أولى)',c:[c('Economics',2,98),c('Humanities',2,82),c('Critical Thinking',0,97),c('Ethics',2,92),c('Math 1',3,94),c('Structured Programming',3,85)]},
    {id:'ts',n:'ترم الصيف',c:[c('Logic Design',3,84),c('Math 2',3,68),c('Prob & Stat 1',3,82)]},
    {id:'t3',n:'الترم الحالي (سنة تانية ترم 1)',c:[c('Math 3',3,''),c('OR & DS',3,''),c('Stat 2',3,''),c('OOP',3,''),c('Networks',3,''),c('Entrepreneurship',0,'')]}
  ]};
}
const gData = () => { if(!S.gpa||!S.gpa.terms) S.gpa=gpaDefault(); return S.gpa; };
function gTerm(t){                           // نقاط وساعات الترم (المواد اللي ليها ساعات ودرجة بس)
  let P=0,H=0,pend=0,pendH=0;
  t.c.forEach(c=>{ const h=+c.h||0; if(h<=0) return; const g=gParse(c.g); if(g){ P+=g.p*h; H+=h; } else { pend++; pendH+=h; } });
  return {P,H,gpa:H?P/H:null,pend,pendH};
}
function gAll(){
  const d=gData(); let P=0,H=0; const per=d.terms.map(t=>{ const r=gTerm(t); P+=r.P; H+=r.H; return r; });
  return {P,H,cgpa:H?P/H:null,per};
}
/* أقل تقدير (من كل التقديرات) متوسطه >= المطلوب */
function gNeed(avg){
  if(avg<=0) return GSCALE[11];
  const ok=GSCALE.slice(0,12).filter(r=>r[1]>=avg-1e-9); return ok.length?ok[ok.length-1]:null;
}
function gPlan(){
  const d=gData(), A=gAll(); const tg=+d.tgt||0;
  const pend=d.terms.map((t,i)=>({t,i,r:A.per[i]})).filter(x=>x.r.pendH>0);
  const pH=pend.reduce((s,x)=>s+x.r.pendH,0);
  if(!pH) return {none:true};
  const curT=d.tmode==='term';
  let need,maxGpa;
  if(curT){                                   // معدل الترم المطلوب (ترم واحد فيه مواد متبقية)
    const x=pend[pend.length-1], base=x.r; need=(tg*(base.H+base.pendH)-base.P)/base.pendH; maxGpa=(base.P+4*base.pendH)/(base.H+base.pendH);
    return {mode:'term',pH:base.pendH,need,maxGpa,rule:gNeed(need),tName:x.t.n};
  }
  const lastP=A.P,lastH=A.H;
  need=(tg*(lastH+pH)-lastP)/pH; maxGpa=(lastP+4*pH)/(lastH+pH);
  return {mode:'cum',pH,need,maxGpa,rule:gNeed(need),tName:null,cum:A.cgpa};
}
function gRetake(){
  const d=gData(), A=gAll(); const cands=[];
  d.terms.forEach((t,ti)=>t.c.forEach((c,ci)=>{
    const h=+c.h||0, g=gParse(c.g); if(h<=0||!g) return;
    const np=Math.min(+d.rt||3,3.0); const ok=g.p>=2.0 && np>g.p;   // ناجحة بنقاط >= 2 والتقدير الجديد أعلى (الحد الأقصى B)
    const gain=ok?(np-g.p)*h:0;
    cands.push({ti,ci,n:c.n,term:t.n,h,g,np,ok,gain,per:ok?gain/h:0});
  }));
  const el=cands.filter(x=>x.ok).sort((a,b)=>b.gain-a.gain||b.per-a.per);
  let best=null; const n=el.length;           // أفضل مجموعة: لحد 3 مواد ومجموع ساعات <= 9
  for(let i=0;i<n;i++){ for(let j=i;j<n;j++){ for(let k=j;k<n;k++){
    const s=[...new Set([i,j,k])].map(x=>el[x]); const hh=s.reduce((a,x)=>a+x.h,0); if(hh>9) continue;
    const gn=s.reduce((a,x)=>a+x.gain,0); if(!best||gn>best.gain+1e-9) best={set:s,gain:gn,h:hh};
  }}}
  return {A,cands,el,best,allowed:A.cgpa!=null&&A.cgpa>=2};
}

function advCalc(u){

  S.earn=S.earn||{}; S.tgt=S.tgt||{};
  const E=S.earn[u]||{}, fm=g[fi][1], tg=S.tgt[u]||'B', T=(GSCALE.find(r=>r[0]===tg)||GSCALE[5])[2];
  let got=0, restMax=0, blank=[];
  g.forEach((x,i)=>{ if(i===fi) return; const v=E[i]; if(v===''||v==null||isNaN(+v)){ restMax+=x[1]; blank.push(x); } else got+=Math.min(+v,x[1]); });
  const total=100, need=T-got, minF=Math.ceil(fm*0.3), maxPoss=got+restMax+fm;
  return {g,fi,fm,tg,T,got,restMax,blank,need,minF,maxPoss,E};
}

}

/* =====================================================================
   COLLEGE TIMETABLE (public build): SCHED_ROWS comes from data/schedule-2026-t1.json (injected by build.ps1).
   Row: [level, group/page, day(JS getDay), slot(1-7), span, course, type(lec/sec/lab/act), place, who, sectionNumbers[]]
   The student picks, per course, a group and his section numbers; the builder fills his timetable (cells with ids 'sc:...').
   ===================================================================== */
SLOTS[6]=['16:15','17:45']; SLOTS[7]=['18:00','19:30'];
const schedNorm=n=>String(n).toLowerCase().replace(/[-_]/g,' ').replace(/&/g,'and').replace(/reserch/g,'research').replace(/sciences/g,'science').replace(/computer networks technology/g,'computer network technology').replace(/\s+/g,' ').trim();
const SCHED_BYN={}; CATALOG.forEach(c=>{ SCHED_BYN[schedNorm(c.n)]=c.k; });
const SCHED_UNMAPPED=[];
const SCH=SCHED_ROWS.map(r=>{ const k=SCHED_BYN[schedNorm(r[5])]; if(!k&&r[6]!=='act'&&SCHED_UNMAPPED.indexOf(r[5])<0) SCHED_UNMAPPED.push(r[5]); return {l:r[0],pg:r[1],g:r[0]+'|'+r[1],d:r[2],s:r[3],n:r[5],t:r[6],p:r[7],w:r[8],secs:r[9],u:k}; }).filter(e=>e.u&&e.t!=='act');
/* "Faculty Activity" slots: a generic activity block (the name differs per student: Game Dev, clubs...), added to every built timetable */
SUBJ.act={n:'سلوت الأنشطة',ar:'',c:'gd',gpa:false,staff:'',grade:[],covered:'',topics:[],rules:[],path:[],rescue:[],quiz:[],res:[],files:[]};
const SCHACT=SCHED_ROWS.filter(r=>r[6]==='act').map(r=>({l:r[0],g:r[0]+'|'+r[1],d:r[2],s:r[3]}));
function schedMainGroup(){
  const p=S.pub||{}, lv=String(p.level||''), gs=Array.from(new Set(SCHACT.map(a=>a.g))).filter(g=>g.indexOf(lv+'|')===0); if(!gs.length) return '';
  const letter=(String(p.group||'').match(/\b([AB])\b/i)||[])[1];
  return gs.find(g=>(letter&&/Group /.test(g)&&g.endsWith(' '+letter.toUpperCase()))||(p.dept&&g.indexOf('('+p.dept+')')>=0))||gs[0];
}
const schedGroupName=g=>{ const a=g.split('|'), m=a[1].match(/\(([A-Z&]+)\)/); return 'سنة '+a[0]+' · '+(m?m[1]:a[1]); };
function schedGroupsFor(u){ const seen={}; SCH.filter(e=>e.u===u).forEach(e=>{ seen[e.g]=1; }); return Object.keys(seen); }
function schedDefaultGroup(u){
  const gs=schedGroupsFor(u); if(!gs.length) return ''; const p=S.pub||{}, lv=String(p.level||'');
  const letter=(String(p.group||'').match(/\b([AB])\b/i)||[])[1];
  const pick=gs.find(g=>g.indexOf(lv+'|')===0&&((letter&&/Group /.test(g)&&g.endsWith(' '+letter.toUpperCase()))||(p.dept&&g.indexOf('('+p.dept+')')>=0)))||gs.find(g=>g.indexOf(lv+'|')===0&&!/Retakes|Second/.test(g))||gs[0];
  return pick;
}
function schedNums(u,g,t){ const s=new Set(); SCH.filter(e=>e.u===u&&e.g===g&&e.t===t).forEach(e=>e.secs.forEach(n=>s.add(n))); return Array.from(s).sort((a,b)=>a-b); }
function pubSchedBtn(){ return '<button class="btn sm" data-pub="sched">ابني جدولي من جدول الكلية</button>'; }
function pubSched(){
  const sel=(S.pub&&S.pub.sched)||{}; const us=ORDER.filter(u=>schedGroupsFor(u).length);
  const miss=ORDER.filter(u=>!schedGroupsFor(u).length).map(u=>SUBJ[u].n);
  const card=u=>{ const c=sel[u]||{}, gs=schedGroupsFor(u), g=c.g||schedDefaultGroup(u), sec=schedNums(u,g,'sec'), lab=schedNums(u,g,'lab'), nl=SCH.filter(e=>e.u===u&&e.g===g&&e.t==='lec').length;
    const sl=(id,label,arr,cur)=>'<label class="fld">'+label+'<select class="in" id="'+id+'"><option value="">مش عارف / مفيش</option>'+arr.map(n=>'<option value="'+n+'"'+(String(cur)===String(n)?' selected':'')+'>S'+n+'</option>').join('')+'</select></label>';
    return '<div class="card" style="margin-top:10px;--c:'+col(u)+'"><b>'+esc(SUBJ[u].n)+'</b>'+(nl?' <span class="sub">· '+nl+' محاضرة بتتضاف تلقائي</span>':'')+
      '<div class="grid g2" style="margin-top:8px"><label class="fld">الجروب<select class="in" id="ps-g-'+u+'">'+gs.map(x=>'<option value="'+x+'"'+(x===g?' selected':'')+'>'+schedGroupName(x)+'</option>').join('')+'</select></label>'+
      (sec.length?sl('ps-sec-'+u,'رقم سكشنك',sec,c.sec):'')+(lab.length?sl('ps-lab-'+u,'رقم اللاب',lab,c.lab):'')+'</div></div>'; };
  openSheet('<div class="row" style="justify-content:space-between"><h2>ابني جدولك</h2><button class="iconbtn" data-act="close" aria-label="إغلاق">×</button></div>'+
   '<p class="sub">من جدول الكلية للترم الأول 2026/27 (النسخة V3). اختار الجروب ورقم سكشنك ولابك لكل مادة، والمحاضرات بتتضاف لوحدها. أي خانة ضفتها بإيدك مش هتتمسح.</p>'+
   (us.length?us.map(card).join(''):'<p class="sub" style="margin-top:10px">مفيش مواد من المختارين ليها مواعيد في الجدول. ضيف مواعيدك بإيدك من «تعديل الجدول».</p>')+
   (miss.length?'<p class="sub" style="margin-top:10px">مواعيدهم مش في جدول الترم الأول: '+esc(miss.join('، '))+'</p>':'')+
   (us.length?'<div class="row" style="margin-top:14px"><button class="btn" data-pub="schedgo">ضيف للجدول</button></div>':''));
}
function pubSchedRead(){
  const sel={}; ORDER.forEach(u=>{ const g=document.getElementById('ps-g-'+u); if(!g) return; const s=document.getElementById('ps-sec-'+u), l=document.getElementById('ps-lab-'+u); sel[u]={g:g.value,sec:s?s.value:'',lab:l?l.value:''}; }); return sel;
}
function pubSchedBuild(sel){
  const out={};
  ORDER.forEach(u=>{ const c=sel[u]; if(!c||!c.g) return;
    SCH.filter(e=>e.u===u&&e.g===c.g).forEach(e=>{
      const sn=e.t==='sec'?c.sec:e.t==='lab'?c.lab:'';
      if(e.t==='lec'||(sn&&e.secs.indexOf(+sn)>=0)){ const id='sc:'+u+':'+e.t+':'+e.d+':'+e.s; out[id]={id,d:e.d,s:e.s,u,t:e.t,p:e.p,w:e.t==='lec'?e.w:'سكشن S'+sn}; } }); });
  const mg=schedMainGroup(); SCHACT.filter(a=>a.g===mg).forEach(a=>{ const id='sc:act:'+a.d+':'+a.s; out[id]={id,d:a.d,s:a.s,u:'act',t:'act',p:'',w:''}; });
  ensureTT(); S.tt=S.tt.filter(x=>String(x.id).indexOf('sc:')!==0).concat(Object.keys(out).map(k=>out[k]));
  S.pub.sched=sel; save(); return Object.keys(out).length;
}

/* ---------- saved-state schema + merge-not-replace migration ---------- */
const MIGS={};   /* MIGS[n]=function(s){...} converts state from schema n-1 to n (rename ids, move keys...) */
function migrateState(o){
  const s=Object.assign(fresh(),o||{});
  s.my=Object.assign({cards:{},quiz:{},links:{},news:[]},(o&&o.my)||{});
  for(let v=(s.sv||0)+1; v<=SCHEMA; v++){ if(MIGS[v]) MIGS[v](s); }
  s.sv=SCHEMA; if(s.pub===undefined) s.pub=null;
  applyPub(s); return s;
}
const pubCourseKey=n=>'x'+hashStr(n.trim().toLowerCase()).toString(36).replace('-','n');
function applyPub(s){
  Object.keys(SUBJ).forEach(k=>{ if(/^[xk]/.test(k)) delete SUBJ[k]; });
  ORDER.length=0; GPA.length=0;
  const p=s.pub;
  if(!p){ PUB_CATALOG.forEach(k=>ORDER.push(k)); }
  else {
    (p.courses||[]).forEach(k=>{ if(PUB_CATALOG.indexOf(k)>=0) ORDER.push(k); else if(CATBY[k]){ const c=CATBY[k]; SUBJ[k]={n:c.n,ar:'',c:PUB_COLORS[ORDER.length%PUB_COLORS.length],gpa:c.h>0,hrs:c.h||3,staff:'',grade:[],covered:'مادة من قايمة الكلية. ضيف مواضيعها وكروتها وأسئلتها من التابات.',topics:[],rules:[],path:[],rescue:[],quiz:[],res:[],files:[]}; ORDER.push(k); } });
    (p.custom||[]).forEach((c,i)=>{ SUBJ[c.k]={n:c.n,ar:'',c:PUB_COLORS[i%PUB_COLORS.length],gpa:true,hrs:c.h,staff:'',grade:[],covered:'مادة أضفتها بنفسك. ضيف مواضيعها وكروتها وأسئلتها من التابات.',topics:[],rules:[],path:[],rescue:[],quiz:[],res:[],files:[]}; ORDER.push(c.k); });
    TERM.name='سنة '+(p.level||'?')+' · ترم '+(p.term||'?')+(p.group?' · '+p.group:'');
  }
  ORDER.forEach(k=>{ if(SUBJ[k].gpa) GPA.push(k); });

let revealObs=null;
function setupReveal(anim){
  const els=$$('.rv'); if(!els.length) return;
  if(!anim||!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  if(revealObs) revealObs.disconnect();
  revealObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); revealObs.unobserve(e.target); } }),{threshold:.08});
  els.forEach(e=>revealObs.observe(e));
  setTimeout(()=>els.forEach(e=>e.classList.add('in')),1800);
}

  if(anim){
    $$('.rise',m).forEach((e,i)=>e.style.setProperty('--i',i));
    $$('.topic,.nitem,.rcard,.links a,.fl,.task,.ev,.qcard,.stat,.empty',m).forEach(e=>{ const sib=Array.from(e.parentNode.children).indexOf(e); e.style.setProperty('--j',Math.min(sib,14)); });
  }
  renderNav(); animateRings(!anim); if(anim) countUp(); applyBump(); setupReveal(anim); tick();
  if(!anim) scrollTo(0,y);
}
window.addEventListener('hashchange',()=>{ render(true); scrollTo(0,0); });
window.addEventListener('resize',()=>renderNav());
function renderSubjTab(u,t){
  ST[u]=t; const m=$('#main');
  if(!route().startsWith('s-')||route().slice(2)!==u){ render(true); return; }
  $$('.tabs button',m).forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t)));
  const full=viewSubject(u), tmp=document.createElement('div'); tmp.innerHTML=full;
  const nb=tmp.querySelector('#tabbody'), ob=$('#tabbody'); if(nb&&ob){ ob.replaceWith(nb); $$('.topic,.nitem,.rcard,.links a,.fl,.qcard',nb).forEach((e,i)=>{ e.style.setProperty('--j',Math.min(i,12)); }); nb.classList.add('anim'); animateRings(true); }
  const act=$('.tabs button[aria-selected="true"]'); if(act&&act.scrollIntoView) act.scrollIntoView({inline:'center',block:'nearest',behavior:reduce?'auto':'smooth'});
}
const curSub = () => { const r=route(); return r.startsWith('s-')?r.slice(2):null; };

/* ---------- click delegation ---------- */
document.addEventListener('click',async e=>{
  if(e.target===$('#modal')){ closeModal(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='close'){ closeModal(); return; }
  if(a==='task'){ const id=b.dataset.id; BUMP='.chk[data-id="'+id+'"]'; if(S.done[id]){ delete S.done[id]; awardXP('t'+id,0,'مهمة'); sfx('undo'); } else { S.done[id]=Date.now(); awardXP('t'+id,10,'مهمة خلصت'); sfx('done'); } save(); render(); }
  else if(a==='lvl'){ const id=b.dataset.id, cur=lvl(id), nx=(cur+1)%4; BUMP='.lvl[data-id="'+id+'"]'; S.topics[id]=nx; awardXP('l'+id,[0,5,15,30][nx],'موضوع'); sfx(nx===0?'undo':nx===3?'level':'good'); if(nx===3){ const r=b.getBoundingClientRect(); confetti(r.left+r.width/2,r.top,30);} save(); render(); }
  else if(a==='stab'){ sfx('tap'); renderSubjTab(b.dataset.u,b.dataset.t); }
  else if(a==='tsub'){ T.sub=b.dataset.u; sfx('tap'); render(); }
  else if(a==='tpre'){ S.focusMin=+b.dataset.f; S.breakMin=+b.dataset.b; save(); sfx('tap'); render(); }
  else if(a==='step'){ const id=b.dataset.id, d=+b.dataset.d, inp=document.getElementById(id); if(!inp) return; const mn=+inp.min, mx=+inp.max; const v=Math.max(mn,Math.min(mx,(+inp.value||mn)+d*(id==='gmin'?10:1))); setCfg(id,v); sfx('tap'); render(); }
  else if(a==='tgo'){ timerStart('focus'); render(); }
  else if(a==='tbrk'){ timerStart('break'); render(); }
  else if(a==='tstop'){ timerStop(false); }
  else if(a==='line'){ sfx('tap'); const el=$('#line'); if(!el) return; S._line=null; const p=genPhrase(); el.classList.add('out'); setTimeout(()=>{ el.textContent=p; el.classList.remove('out'); },220); save(); }
  else if(a==='settings'){ openSettings(); }
  else if(a==='xp'){ openXP(); animateRings(false); }
  else if(a==='resetxp'){ if(b.dataset.sure){ S.xp=0; S.xpMap={}; S.log=[]; save(); closeModal(); render(); toast('اتصفّرت النقط'); } else { b.dataset.sure=1; b.textContent='تأكيد التصفير؟'; } }
  else if(a==='nfu'){ NF.u=b.dataset.u; sfx('tap'); render(true); }
  else if(a==='nfk'){ NF.k=b.dataset.k; sfx('tap'); render(true); }
else if(a==='qf'){ QF=b.dataset.k; QZ.cur=null; LAY.show=false; QZ.exp=""; sfx("tap"); renderSubjTab(b.dataset.u,'quiz'); } 
  else if(a==='qtopic'){ const id=b.dataset.id, cur=lvl(id); if(cur>=2){ toast('الموضوع ده عندك «'+['لسه','شفته','فهمته','حليت عليه'][cur]+'». غيّره من تاب المواضيع'); return; } const nx=cur>=1?0:1; S.topics[id]=nx; awardXP('l'+id,[0,5,15,30][nx],'موضوع'); sfx(nx?'good':'undo'); save(); QZ.cur=null; QZ.seen={}; QZ.topicsOpen=true; renderSubjTab(curSub(),'quiz'); }
  else if(a==='wxset'){ wxSetManual(b.dataset.k); closeModal(); sfx('good'); }
  else if(a==='wxsnd'){ S.wxsnd=!S.wxsnd; save(); if(S.wxsnd){ WXGESTURE=true; wxAmbStart(); sfx('good'); } else wxAmbStop(); closeModal(); toast(S.wxsnd?'صوت الجو شغال':'صوت الجو اتقفل'); }
  else if(a==='laykind'){ LAY.kind=b.dataset.k; LAY.i=0; LAY.show=false; sfx('tap'); renderSubjTab(curSub(),'quiz'); }
  else if(a==='laysec'){ LAY.sec=b.dataset.k; LAY.i=0; LAY.show=false; sfx('tap'); renderSubjTab(curSub(),'quiz'); }
  else if(a==='layshow'){ LAY.show=true; sfx('soft'); renderSubjTab(curSub(),'quiz'); }
  else if(a==='laynext'||a==='layprev'){ const n=layList().length||1; LAY.i=(LAY.i+(a==='laynext'?1:n-1))%n; LAY.show=false; sfx('tap'); renderSubjTab(curSub(),'quiz'); }
  else if(a==='laysolved'){ const e=layList()[LAY.i]; if(e){ S.lay=S.lay||{}; const id=layId(e); if(S.lay[id]){ delete S.lay[id]; awardXP(id,0,'مثال'); sfx('undo'); } else { S.lay[id]=1; awardXP(id,10,'مثال Lay'); sfx('good'); } save(); } renderSubjTab(curSub(),'quiz'); }
  else if(a==='qunc'){ SHOWUNC=!SHOWUNC; QZ.cur=null; sfx('tap'); renderSubjTab(curSub(),'quiz'); }
  else if(a==='qshow'){ QZ.show=true; BUMP='.qans'; sfx('soft'); renderSubjTab(curSub(),'quiz'); }  else if(a==='qopt'){ quizChoose(curSub(),+b.dataset.i); renderSubjTab(curSub(),'quiz'); }  else if(a==='qnext'||a==='qn'){ sfx('tap'); quizNext(curSub()); renderSubjTab(curSub(),'quiz'); }  else if(a==='qk'){ const u=curSub(), q=QZ.cur; if(q){ const c=(S.cards[q.id]||0); S.cards[q.id]=c+1; if(c<2){ addAct(0); addXP(3,'سؤال '+SUBJ[u].n); } QZ.ok++; sfx('good'); save(); } quizNext(u); renderSubjTab(u,'quiz'); }
  else if(a==='fdone'){ const n=b.dataset.n, f=OOPF.find(x=>x[0]==n), o=S.oopf[n]||(S.oopf[n]={}); const cur=o.done!=null?o.done:!!f[3]; o.done=!cur; BUMP='[data-act="fdone"][data-n="'+n+'"]'; if(!f[3]) awardXP('f'+n,o.done?10:0,'فلتر '+n); sfx(o.done?'done':'undo'); save(); render(); }
  else if(a==='fex'){ const n=b.dataset.n, o=S.oopf[n]||(S.oopf[n]={}); o.ex=!o.ex; BUMP='[data-act="fex"][data-n="'+n+'"]'; awardXP('x'+n,o.ex?5:0,'أشرح فلتر '+n); sfx(o.ex?'good':'undo'); save(); render(); }
  else if(a==='ru'){ openRescue(b.dataset.u); }
  else if(a==='hide'){ const id=b.dataset.id; if(S.hide[id]) delete S.hide[id]; else S.hide[id]=1; save(); sfx('tap'); render(); }
  else if(a==='showhid'){ SHOWHID=!SHOWHID; render(); }
  else if(a==='cancelc'){ const k=dayKey()+':'+b.dataset.id; if(S.cancel[k]) delete S.cancel[k]; else S.cancel[k]=1; if(S.att[k]) awardXP('att:'+k,S.cancel[k]?0:ATT_XP,'حضور'); save(); sfx('tap'); render(); }
  else if(a==='attend'){ const id=b.dataset.id, k=dayKey()+':'+id, e=cells().find(x=>x.id===id); if(S.cancel[k]) return; if(S.att[k]){ delete S.att[k]; awardXP('att:'+k,0,'حضور'); sfx('undo'); } else { S.att[k]=1; awardXP('att:'+k,ATT_XP,'حضور '+(e&&SUBJ[e.u]?SUBJ[e.u].n:'')); sfx('good'); } save(); render(); }
  else if(a==='edittt'){ EDIT=!EDIT; sfx('tap'); render(); }
  else if(a==='resettt'){ if(b.dataset.sure){ S.tt=null; S.slots=null; save(); render(); toast('رجع الجدول الأصلي'); } else { b.dataset.sure=1; b.textContent='تأكيد الرجوع؟'; } }
  else if(a==='editcell'){ openCell(b.dataset.id); }
  else if(a==='addcell'){ openCell(null,b.dataset.d,b.dataset.s); }
  else if(a==='delcell'){ ensureTT(); S.tt=S.tt.filter(c=>c.id!==b.dataset.id); save(); closeModal(); render(); toast('اتحذفت'); }
  else if(a==='addcard'){ openAdd('card',b.dataset.u); }
  else if(a==='addq'){ openAdd('q',b.dataset.u); }
  else if(a==='addlink'){ openAdd('link',b.dataset.u); }
  else if(a==='addnews'){ openAdd('news',b.dataset.u||curSub()||'oop'); }
  else if(a==='delcard'){ const u=b.dataset.u; S.my.cards[u]=(S.my.cards[u]||[]).filter(x=>x.id!==b.dataset.id); save(); render(); }
  else if(a==='delq'){ const u=b.dataset.u; S.my.quiz[u]=(S.my.quiz[u]||[]).filter(x=>x.id!==b.dataset.id); save(); Q.i=0; renderSubjTab(u,'quiz'); }
  else if(a==='dellink'){ const u=b.dataset.u; S.my.links[u]=(S.my.links[u]||[]).filter(x=>x.id!==b.dataset.id); save(); render(); }
  else if(a==='delnews'){ S.my.news=S.my.news.filter(x=>x.id!==b.dataset.id); save(); render(); }
  else if(a==='deltopic'){ const u=b.dataset.u; S.ctopics[u]=(S.ctopics[u]||[]).filter(x=>x.id!==b.dataset.id); delete S.topics[b.dataset.id]; awardXP('l'+b.dataset.id,0,'حذف موضوع'); save(); render(); }
  else if(a==='theme'){ const r=b.getBoundingClientRect(); setTheme(b.dataset.t,r.left+r.width/2,r.top+r.height/2); sfx('soft'); setTimeout(openSettings,60); }
  else if(a==='sound'){ S.sound=!S.sound; save(); if(S.sound) sfx('good'); openSettings(); }
  else if(a==='export'){ pubExport(); }
  else if(a==='resetall'){ if(b.dataset.sure){ S=fresh(); save(); closeModal(); applyTheme(); render(true); toast('اتمسحت البيانات'); } else { b.dataset.sure=1; b.textContent='تأكيد المسح؟ (مفيش رجوع)'; } }
  else if(a==='resetslots'){ S.slots=null; save(); openSettings(); render(); }
});
function setCfg(id,v){ if(id==='fmin') S.focusMin=v; else if(id==='bmin') S.breakMin=v; else if(id==='gmin') S.goal=v; save(); }
function ensureTT(){ if(!S.tt) S.tt=JSON.parse(JSON.stringify(DEFAULT_TT)); }

/* ---------- forms ---------- */
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const k=f.dataset.form;
  if(k==='task'){ const t=$('#nt').value.trim(); if(!t) return; S.ctasks.push({id:uid(),u:$('#ns').value,t:t,due:$('#nd').value||null}); save(); sfx('good'); render(); toast('اتضافت'); }
  else if(k==='topic'){ const t=$('#tn').value.trim(), u=f.dataset.u; if(!t) return; (S.ctopics[u]||(S.ctopics[u]=[])).push({id:u+':c'+uid(),t:t}); save(); sfx('good'); render(); toast('اتضاف'); }
  else if(k==='cell'){
    ensureTT(); const id=f.dataset.id, o={d:+$('#cd').value,s:+$('#cs').value,u:$('#cu').value,t:$('#ct').value,p:$('#cp').value.trim(),w:$('#cw').value.trim()};
    if(id){ const c=S.tt.find(x=>x.id===id); if(c){ Object.assign(c,o); delete c.chk; delete c.n; } } else S.tt.push(Object.assign({id:uid()},o));
    save(); closeModal(); sfx('good'); render(); toast('اتحفظت');
  }
  else if(k==='add'){
    const kind=f.dataset.kind, u=$('#au').value, a1=($('#a1').value||'').trim(), a2=($('#a2').value||'').trim(), a3=$('#a3')?$('#a3').value.trim():'';
    if(!a1) return;
    if(kind==='card') (S.my.cards[u]||(S.my.cards[u]=[])).push({id:uid(),h:a1,b:a2});
    else if(kind==='q') (S.my.quiz[u]||(S.my.quiz[u]=[])).push({id:uid(),q:a1,a:a2});
    else if(kind==='link') (S.my.links[u]||(S.my.links[u]=[])).push({id:uid(),l:a1,url:a2,note:a3});
    else if(kind==='news') S.my.news.push({id:uid(),u,d:a2||dayKey(),k:a3||'note',t:a1});
    save(); closeModal(); sfx('good'); render(); toast('اتضاف');
  }
});

/* ---------- inputs ---------- */
let nt=null;
document.addEventListener('input',e=>{ if(e.target.id==='notes'){ const u=e.target.dataset.u, v=e.target.value; clearTimeout(nt); nt=setTimeout(()=>{ S.notes[u]=v; save(); },500); } });
document.addEventListener('change',e=>{
  const t=e.target, a=t.dataset&&t.dataset.actIn;
  if(t.dataset&&t.dataset.adv){ const u=t.dataset.u; if(t.dataset.adv==='tgt'){ (S.tgt=S.tgt||{})[u]=t.value; } else { const E=((S.earn=S.earn||{})[u]=S.earn[u]||{}); E[t.dataset.i]=t.value===''?'':Math.max(0,+t.value); } save(); render(); return; }
  if(t.id==='midd'){ S.mid[t.dataset.u]=t.value||''; save(); toast('اتسجّل ميعاد الميد'); render(); return; }
  if(!a) return;
  if(a==='stepin'){ const mn=+t.min, mx=+t.max, v=Math.max(mn,Math.min(mx,Math.round(+t.value)||mn)); setCfg(t.id,v); render(); }
  else if(a==='mid'){ S.mid[t.dataset.u]=t.value||''; save(); render(); }
  else if(a==='week1'){ if(t.value){ S.week1=t.value; save(); render(); } }
  else if(a==='slotA'||a==='slotB'){ if(!S.slots) S.slots=JSON.parse(JSON.stringify(SLOTS)); const i=t.dataset.i; S.slots[i][a==='slotA'?0:1]=t.value||S.slots[i][a==='slotA'?0:1]; save(); render(); }
  else if(a==='import'){ const f=t.files&&t.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o||typeof o!=='object'||!('xp' in o)) throw 0; S=migrateState(o); save(); applyTheme(); closeModal(); render(true); toast('اتسترجعت البيانات'); }catch(err){ toast('الملف مش نسخة احتياطية صالحة'); } }; rd.readAsText(f); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- ripple + mascot eyes ---------- */
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.btn,.lvl,.mini,.seg button,.tabs button,.filters button,.chk,.iconbtn,.step button'); if(!b||reduce) return;
  const r=b.getBoundingClientRect(), s=Math.max(r.width,r.height)*2, sp=document.createElement('span');
  sp.className='ripple'; sp.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  b.appendChild(sp); setTimeout(()=>sp.remove(),650);
});
document.addEventListener('pointermove',e=>{
  if(reduce) return; const m=$('.mascot'); if(!m) return; const g=m.querySelector('.pupils'); if(!g) return;
  const r=m.getBoundingClientRect(), dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2), d=Math.hypot(dx,dy)||1, k=Math.min(1,d/220)*4;
  g.style.transform='translate('+(dx/d*k).toFixed(2)+'px,'+(dy/d*k).toFixed(2)+'px)';
});

/* ---------- floating help button: shrinks while scrolling down so it never covers content ---------- */
let lastY=0;
window.addEventListener('scroll',()=>{ const y=scrollY, f=$('#fab'); if(!f) return; if(y>lastY+8&&y>160) f.classList.add('compact'); else if(y<lastY-8||y<160) f.classList.remove('compact'); lastY=y; },{passive:true});

/* ---------- header buttons ---------- */
$('#fab').addEventListener('click',()=>{ sfx('open'); const u=curSub(); openRescue(u&&cardsFor(u).length?u:null); });
$('#themeBtn').addEventListener('click',e=>{ const r=e.currentTarget.getBoundingClientRect(); setTheme(currentIsDark()?'light':'dark',r.left+r.width/2,r.top+r.height/2); sfx('soft'); });
$('#gearBtn').addEventListener('click',()=>{ sfx('open'); openSettings(); });
$('#xp').addEventListener('click',()=>{ sfx('open'); openXP(); animateRings(false); });

/* ---------- boot ---------- */
load(); applyTheme(); buildNav(); render(true); initRemote(); loadWeather().then(()=>wxFromDb()).then(()=>wxManualInit());
setInterval(()=>{ const ae=document.activeElement; if(route()==='home'&&T.st==='idle'&&!$('#modal').classList.contains('on')&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render(); },60000);
</script>
