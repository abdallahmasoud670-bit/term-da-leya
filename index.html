<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3563FF"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="description" content="جدولك من جدول الكلية، وتعرف تذاكر إيه النهارده، وأسئلة وكروت مراجعة، وحاسبة معدل. مجاني لطلبة FCAI جامعة القاهرة."><meta property="og:type" content="website"><meta property="og:locale" content="ar_EG"><meta property="og:site_name" content="الترم ده ليا"><meta property="og:title" content="الترم ده ليا: مذاكرتك مرتبة في مكان واحد"><meta property="og:description" content="ترم كامل ومواد كتير؟ جدولك من جدول الكلية، وتذاكر إيه النهارده، وحاسبة معدل. مجاني لطلبة FCAI."><meta property="og:url" content="https://abdallahmasoud670-bit.github.io/term-da-leya/"><meta property="og:image" content="https://abdallahmasoud670-bit.github.io/term-da-leya/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%23FFC21A%27/%3E%3Cg stroke=%27%23FFC21A%27 stroke-width=%275%27 stroke-linecap=%27round%27%3E%3Cpath d=%27M32 4v8M32 52v8M4 32h8M52 32h8M12 12l6 6M46 46l6 6M52 12l-6 6M18 46l-6 6%27/%3E%3C/g%3E%3C/svg%3E"><script data-goatcounter="https://abdallahmasoud.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script><title>الترم ده ليا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Concept: calm, bright study board. One hue per course, sun by day / moon by night,
   smooth non-bouncy motion, progress shown as rings and bars. */
:root{
  --bg:#F3F7FF; --bg2:#E5EEFF; --card:#FFFFFF; --ink:#18214D; --ink2:#566088; --line:#DAE5FA;
  --brand:#3563FF; --brand-ink:#FFFFFF; --sun:#FFC21A; --sun-ink:#4A3300;
  --good:#0FA37A; --warn:#E87612; --bad:#E2395F;
  --c-math:#8B5CF6; --c-or:#F5791B; --c-net:#0B9CC0; --c-oop:#0FA37A; --c-stat:#E8458F; --c-ent:#D79A00; --c-gd:#4C7DFF;
  --shadow:0 8px 28px rgba(45,75,170,.10); --shadow-s:0 2px 8px rgba(45,75,170,.08);
  --r:22px; --r-s:14px; --ease:cubic-bezier(.22,.9,.3,1);
  --f-d:'Baloo Bhaijaan 2','Tajawal','Segoe UI',Tahoma,sans-serif;
  --f-b:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1230; --bg2:#151B42; --card:#1A2150; --ink:#EEF2FF; --ink2:#A9B3E0; --line:#2B3568;
  --brand:#7C9BFF; --brand-ink:#0E1230; --sun:#FFD04A; --sun-ink:#3B2A00;
  --good:#38D9A9; --warn:#FFA64D; --bad:#FF7A9A;
  --c-math:#A78BFA; --c-or:#FFA64D; --c-net:#3CCBE8; --c-oop:#36D6A5; --c-stat:#FF7FB5; --c-ent:#FFD34D; --c-gd:#8AA7FF;
  --shadow:0 8px 28px rgba(0,0,0,.35); --shadow-s:0 2px 8px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1230; --bg2:#151B42; --card:#1A2150; --ink:#EEF2FF; --ink2:#A9B3E0; --line:#2B3568;
  --brand:#7C9BFF; --brand-ink:#0E1230; --sun:#FFD04A; --sun-ink:#3B2A00;
  --good:#38D9A9; --warn:#FFA64D; --bad:#FF7A9A;
  --c-math:#A78BFA; --c-or:#FFA64D; --c-net:#3CCBE8; --c-oop:#36D6A5; --c-stat:#FF7FB5; --c-ent:#FFD34D; --c-gd:#8AA7FF;
  --shadow:0 8px 28px rgba(0,0,0,.35); --shadow-s:0 2px 8px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.6;
  background-image:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--sun) 20%,transparent),transparent),
  radial-gradient(700px 380px at -10% 10%,color-mix(in srgb,var(--brand) 12%,transparent),transparent);
  background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
bdi.f{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:.92em;
  background:color-mix(in srgb,var(--c,var(--brand)) 12%,var(--card));padding:1px 7px;border-radius:8px;white-space:nowrap}
pre.code{direction:ltr;text-align:left;margin:8px 0 0;padding:12px 14px;border-radius:12px;background:var(--bg2);overflow-x:auto;font-family:ui-monospace,Consolas,monospace;font-size:.86rem;line-height:1.55;white-space:pre}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
#root{min-height:100vh;padding-bottom:110px}
html{scroll-behavior:smooth}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:800;font-size:1.2rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand .dot{width:34px;height:34px;border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.nav{display:flex;gap:2px;margin-inline-start:10px;position:relative;padding:3px;border-radius:999px;background:var(--bg2)}
.nav a{position:relative;z-index:1;padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:700;transition:color .3s var(--ease)}
.nav a[aria-current="page"]{color:var(--bg)}
.nav .ind{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:999px;background:var(--ink);transition:inset-inline-start .45s var(--ease),width .45s var(--ease)}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.9rem;box-shadow:var(--shadow-s);cursor:pointer}
.xp b{font-family:var(--f-d);color:var(--brand)}
.xpbar{width:54px;height:7px;border-radius:9px;background:var(--bg2);overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--warn));border-radius:9px;transition:width 1s var(--ease)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow-s);flex:none}
.iconbtn svg{width:20px;height:20px}
.pill-timer{display:none;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800;font-variant-numeric:tabular-nums;text-decoration:none}
.pill-timer.on{display:inline-flex}
.pill-timer i{width:9px;height:9px;border-radius:50%;background:var(--sun);animation:pulse 1.4s infinite}
.bnav{display:none}
@media (max-width:860px){.top .iconbtn.hide-s{display:none}}
@media (max-width:760px){
  .nav{display:none}
  .xp .lv{display:none}
  .bnav{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;text-decoration:none;color:var(--ink2);font-size:.72rem;font-weight:700;transition:background .3s,color .3s}
  .bnav a[aria-current="page"]{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
  .bnav svg{width:22px;height:22px}
}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(45,75,170,.14)}
.card h3{font-size:1.15rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:var(--ink2);font-size:.92rem}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:800;background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--brand) 60%,#000);text-decoration:none;display:inline-block}
.btn.soft{background:var(--bg2);color:var(--ink);box-shadow:none}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 65%,#000)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn.sm{padding:6px 14px;font-size:.88rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:.82rem;font-weight:700;
  background:color-mix(in srgb,var(--c,var(--brand)) 15%,var(--card));color:var(--ink);border:1px solid color-mix(in srgb,var(--c,var(--brand)) 35%,transparent)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--brand))}
.tag{display:inline-block;padding:1px 9px;border-radius:8px;font-size:.78rem;font-weight:800}
.tag.deadline{background:color-mix(in srgb,var(--bad) 16%,var(--card));color:var(--bad)}
.tag.change{background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)}
.tag.todo{background:color-mix(in srgb,var(--brand) 16%,var(--card));color:var(--brand)}
.tag.note{background:var(--bg2);color:var(--ink2)}
.tag.exam{background:color-mix(in srgb,var(--c-stat) 16%,var(--card));color:var(--c-stat)}
.tag.drill{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--good)}
.tag.mine{background:color-mix(in srgb,var(--sun) 28%,var(--card));color:var(--sun-ink)}
.sec{margin-top:28px}
.sec>h2{font-size:1.45rem;margin-bottom:14px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes settle{from{transform:scale(.97)}to{transform:scale(1)}}
@keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-34px) scale(1.08)}100%{transform:translate(0,0) scale(1)}}
@keyframes shimmer{from{transform:translateX(120%)}to{transform:translateX(-120%)}}
@keyframes ripple{from{transform:scale(0);opacity:.35}to{transform:scale(1);opacity:0}}
@keyframes glow{50%{filter:drop-shadow(0 0 8px var(--c))}}
@keyframes toastIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
@keyframes slideFade{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.anim .rise{animation:rise .65s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms)}
.anim .topic,.anim .nitem,.anim .rcard,.anim .links a,.anim .fl,.anim .task,.anim .ev,.anim .qcard,.anim .stat,.anim .empty,.anim .mycard{animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--j,0)*40ms + 100ms)}
.rv{opacity:.55;transform:translateY(14px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-top:22px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 36%,var(--card)),color-mix(in srgb,var(--c-stat) 14%,var(--card)) 70%,color-mix(in srgb,var(--brand) 20%,var(--card)));
  border:1px solid var(--line);border-radius:28px;padding:22px 26px;box-shadow:var(--shadow);transition:background .8s}
.hero.night{background:linear-gradient(135deg,color-mix(in srgb,#2B3A8F 55%,var(--card)),color-mix(in srgb,#5B3FA8 40%,var(--card)) 70%,color-mix(in srgb,var(--brand) 25%,var(--card)))}
.hero::before{content:"";position:absolute;inset:-45%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 30% 35%,color-mix(in srgb,var(--sun) 50%,transparent),transparent 38%),radial-gradient(circle at 72% 62%,color-mix(in srgb,var(--c-stat) 30%,transparent),transparent 42%),radial-gradient(circle at 55% 20%,color-mix(in srgb,var(--brand) 24%,transparent),transparent 40%);animation:spin 40s linear infinite}
.hero.night::before{background:radial-gradient(circle at 30% 35%,rgba(120,140,255,.35),transparent 38%),radial-gradient(circle at 72% 62%,rgba(180,120,255,.25),transparent 42%)}
.hero>*{position:relative;z-index:1}
.hero.night h1,.hero.night .line{color:#F2F4FF}
.mascot{width:120px;height:120px;animation:bob 6s ease-in-out infinite}
.mascot .rays{transform-origin:60px 60px;animation:spin 40s linear infinite}
.mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 5s infinite}
.mascot .pupils{transition:transform .22s ease-out}
.mascot .star{transform-origin:center;transform-box:fill-box;animation:twinkle 3s ease-in-out infinite}
.mascot .star:nth-of-type(2){animation-delay:-1s}.mascot .star:nth-of-type(3){animation-delay:-2s}
.mascot.jump{animation:none;transform:translateY(-8px);transition:transform .25s var(--ease)}
.hero h1{font-size:clamp(1.6rem,4.4vw,2.4rem)}
.hero .line{margin-top:6px;font-size:1.08rem;max-width:56ch;min-height:3.2em}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stat{background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);border-radius:16px;padding:6px 14px;font-weight:700;color:var(--ink)}
.stat b{font-family:var(--f-d);font-size:1.25rem;margin-inline-end:4px}
@media (max-width:560px){.hero{grid-template-columns:1fr;padding:18px}.mascot{width:76px;height:76px}.hero .stat{padding:3px 11px;font-size:.88rem}.hero .stat b{font-size:1.05rem}}
.fadeline{transition:opacity .25s,transform .25s}
.fadeline.out{opacity:0;transform:translateY(6px)}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:82px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-s);
  background:color-mix(in srgb,var(--c) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c) 28%,transparent);position:relative;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),opacity .35s}
.ev.att{grid-template-columns:82px 1fr auto auto}
.ev:hover{transform:translateX(-3px)}
.ev time{font-variant-numeric:tabular-nums;font-weight:800;font-size:.9rem;color:var(--ink2);line-height:1.3}
.ev b{font-family:var(--f-d);font-size:1.05rem}
.ev.now{box-shadow:0 0 0 3px var(--c)}
.ev.done{opacity:.5}
.ev.cancelled b{text-decoration:line-through}
.ev .st{font-size:.78rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--c);color:#fff}
:root[data-theme="dark"] .ev .st{color:#10163A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev .st{color:#10163A}}
.flag{font-size:.78rem;color:var(--warn);font-weight:800}
.place{font-size:.82rem;color:var(--ink2)}

/* ---------- tasks ---------- */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:10px;border:2.5px solid var(--c,var(--brand));background:var(--card);display:grid;place-items:center;padding:0}
.chk svg{width:18px;height:18px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s var(--ease)}
.chk[aria-pressed="true"]{background:var(--c,var(--brand))}
.chk[aria-pressed="true"] svg{stroke-dashoffset:0}
.task.is-done .tt{text-decoration:line-through;opacity:.55}
.tt{font-weight:700}
.due{font-size:.8rem;font-weight:800;white-space:nowrap}
.due.late{color:var(--bad)}.due.soon{color:var(--warn)}.due.ok{color:var(--ink2)}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.add input,.add select,.in,select.in{font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0;transition:border-color .25s,box-shadow .25s}
.add input:focus,.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent);outline:0}
.add input[type=text]{flex:1 1 160px}
textarea.in{width:100%;min-height:130px;resize:vertical;line-height:1.7}
label.fld{display:grid;gap:4px;font-weight:700;font-size:.86rem;color:var(--ink2)}

/* ---------- rings & bars ---------- */
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--bg2)}
.ring .fg{stroke:var(--c,var(--brand));transition:stroke-dashoffset 1.2s var(--ease)}
.ring .mid{position:absolute;text-align:center;font-family:var(--f-d);font-weight:800;line-height:1.1}
.ring .mid small{display:block;font-family:var(--f-b);font-weight:500;font-size:.7rem;color:var(--ink2)}
.ring.live{animation:glow 2.4s ease-in-out infinite}
.bar{height:9px;border-radius:9px;background:color-mix(in srgb,var(--c) 18%,var(--bg));overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width 1s var(--ease);position:relative;overflow:hidden}
.bar i::after,.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 3s infinite}

/* ---------- timer ---------- */
.timer{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--c,var(--ink));border-color:transparent;color:#fff}
.seg.k button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.step{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:2px}
.step button{width:28px;height:28px;border-radius:50%;border:0;background:var(--bg2);font-weight:800}
.step input{width:44px;text-align:center;border:0;background:transparent;font:inherit;font-weight:800;color:var(--ink)}
@media (max-width:480px){.timer{grid-template-columns:1fr;justify-items:center;text-align:center}}

/* ---------- subject cards & pages ---------- */
.sc{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;padding:18px;border-radius:var(--r);position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--c) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c) 32%,transparent);box-shadow:var(--shadow-s);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.sc:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.sc h3{font-size:1.2rem}
.sc .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sc .meta{font-size:.84rem;color:var(--ink2)}
.sh{margin-top:22px;border-radius:28px;padding:24px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#1B2260))}
.sh h1{font-size:clamp(1.7rem,5vw,2.6rem)}
.sh .sub{color:rgba(255,255,255,.88)}

  rules:['الميد مفيهوش ورقة قوانين، فاحفظ القوانين لحد Section 6 (ده كان نطاق ميد السنة اللي فاتت).','الفاينل بيدّيك ورقة قوانين. لازم تعرف كل قانون يتستخدم إمتى ومكانه في الورقة.','د. إيهاب مش بيبتكر. حل أسئلة السكاشن والامتحانات القديمة هو أهم حاجة.','قاعدة الـpercentile عندهم: الموضع i = (P/100)·n. لو مش صحيح قرّب لفوق، ولو صحيح خد متوسط القيمة i والقيمة i+1.','ملخصات Flashat فيها معلومات غلط، متعتمدش عليها لوحدها.','الكويزات غالباً أونلاين.'],
  path:['الدكتور مش ماشي على كتاب ومش بيبعت السلايدات. من فاينل 2024 و2019: الأسئلة وصفي وsampling وCI (متوسط، نسبة، تباين chi-square) واختبارات فرضيات (نسبة، تباين F، متوسطين، paired) وchi-square للاستقلال وregression وMLE (2019). أنسب كتاب أساسي: Walpole 9th (بيغطي كل ده). للوصفي وgrouped data وـFPC ذاكر Lind. Montgomery بديل لـWalpole.','حل Section 1 و2 من سكاشن السنة اللي فاتت (على الدرايف).','احفظ قوانين الـdescriptive واحسبها على 3 أمثلة بإيدك.','حل ميد 2022 وميد 2025 كاملين تحت وقت (ساعة).','ابدأ بدري في Sampling distribution وConfidence intervals لأنهم الأثقل في الميد.'],
  rescue:[
   ['أنواع البيانات','Quantitative (أرقام: discrete عدّ وcontinuous قياس) وQualitative (صفات). مستويات القياس من الأضعف للأقوى: Nominal ثم Ordinal ثم Interval ثم Ratio (فيه صفر حقيقي). Time series يعني نفس المتغير عبر الزمن، وCross-sectional يعني ناس كتير في نفس الوقت.'],
   ['Mean وMedian وMode','Mean = المجموع ÷ العدد. Median = الرقم اللي في النص بعد الترتيب (لو العدد زوجي: متوسط الرقمين اللي في النص). Mode = الأكثر تكراراً. القيم الشاذة بتأثر في Mean أكتر من Median.'],
   ['المتوسط الموزون','<bdi class="f">x̄w = Σ(w·x) / Σw</bdi>. استخدمه لما القيم ليها أوزان مختلفة، زي الدرجات بالساعات المعتمدة.'],
   ['Percentiles و Quartiles (طريقة الدكتور)','الموضع <bdi class="f">i = (P/100)·n</bdi>. لو i مش صحيح: قرّب لفوق وخد القيمة دي. لو صحيح: متوسط القيمة i والقيمة i+1. <bdi class="f">IQR = Q3 − Q1</bdi>. الحدود: <bdi class="f">Q1 − 1.5·IQR</bdi> و<bdi class="f">Q3 + 1.5·IQR</bdi>، وأي قيمة برا الحدود outlier.'],
   ['التباين والانحراف المعياري','عينة: <bdi class="f">s² = Σ(x − x̄)² / (n − 1)</bdi>. مجتمع: <bdi class="f">σ² = Σ(x − μ)² / N</bdi>. الانحراف المعياري هو الجذر التربيعي للتباين. Range = أكبر − أصغر. <bdi class="f">CV = s / x̄ × 100%</bdi> لمقارنة تشتت مجموعتين بوحدات مختلفة.'],
   ['Grouped data','عدد الفئات k من <bdi class="f">2^k ≥ n</bdi>، وعرض الفئة = Range ÷ k (قرّب لفوق). منتصف الفئة <bdi class="f">m = (حد أدنى + حد أعلى) / 2</bdi>. المتوسط <bdi class="f">x̄ ≈ Σ(f·m) / Σf</bdi>.'],
   ['أنواع العينات','Simple random: كل عنصر فرصته متساوية. Systematic: كل عنصر رقم k. Stratified: عينة عشوائية من كل طبقة. Cluster: بتختار مجموعات كاملة عشوائياً (زي مستشفيات) وتسأل كل اللي فيها.']],
  quiz:[
   ['البيانات: 2, 4, 4, 6, 9. احسب Mean وMedian وMode والانحراف المعياري للعينة.','Mean = 5، Median = 4، Mode = 4. مجموع مربعات الانحرافات = 28، فـ s² = 28/4 = 7 وs ≈ 2.65.'],
   ['درجة الحرارة بالسيلزيوس. أنهي مستوى قياس؟','Interval. الفروق ليها معنى لكن الصفر مش حقيقي.'],
   ['ليه بنقسم على n − 1 في تباين العينة؟','عشان متوسط العينة بيتحسب من نفس البيانات، فالقسمة على n بتطلّع تباين أقل من الحقيقي. n − 1 بيعطي تقدير غير متحيز.'],
   ['مين أكتر تأثراً بالقيم الشاذة: Mean ولا Median؟','Mean.'],
   ['رتبة التقدير (ممتاز، جيد، مقبول). مستوى القياس؟','Ordinal. فيه ترتيب لكن الفروق مش متساوية.'],
   ['البيانات المرتبة: 146, 218, 242, 249, 277, 319, 347, 391, 567. احسب Q1 وQ2 وQ3 وحدود الـoutliers (بطريقة الدكتور).','n = 9. Q1: 2.25 فتقريب لفوق 3 فالقيمة 242. Q2: 4.5 فتقريب 5 فالقيمة 277. Q3: 6.75 فتقريب 7 فالقيمة 347. IQR = 105. الحد الأدنى 84.5 والأعلى 504.5، فـ 567 outlier والبيانات ملتوية لليمين.','exam'],
   ['درجات امتحان ~ Normal بمتوسط 59.5 وانحراف 5. احتمال إن متوسط عينة من 16 طالب أقل من 56؟','SE = 5/√16 = 1.25. z = (56 − 59.5)/1.25 = −2.8. الاحتمال ≈ 0.0026.','exam'],
   ['عينة 26 بيت، متوسط الاستهلاك 64 وانحراف 8.8. فترة ثقة 90% للمتوسط (ميد 2025)؟','t(25) بـ 90% = 1.708. الهامش = 1.708 × 8.8/√26 ≈ 2.95. الفترة ≈ [61.05, 66.95].','exam'],

 oop:{n:'OOP',ar:'البرمجة كائنية التوجه',c:'oop',gpa:true,

  covered:'وصلوا Set 6 ص5: Separate Compilation وبداية Inheritance. أعمال السنة محسوبة من 45 وفوق الـ40 بونص. المحاضرات: الأحد والخميس الساعة 12:45 م.',
  topics:['Programming Paradigms','Struct','Arrays of Structures','Passing Structs to Functions','Nested Structs وPointers to Structs','Classes وEnums','Pointers','Arrays and Pointers','Dynamic Memory Allocation','Smart Pointers','Reference Variables','Pass-by-value وPass-by-reference','C-style Structs vs C++ Classes','Classes in C++','Abstraction وClassification','Encapsulation','Inheritance','Polymorphism','C++ Templates and Genericity','OO Development Stages','Class Model وProblem Domain','UML Class Diagram','Separate Compilation'],
  rules:['الـOutline بيقول لازم 8 ساعات في الأسبوع على الأقل برا المحاضرة.','الـclass والـpointers أساس باقي الترم، ركّز فيهم جداً.','الأسايمنت بيتناقش: كل واحد في التيم لازم يفهم كود الكل. الغايب عن المناقشة بياخد صفر.','لو المعيد عرف إن الكود من AI الخصم 7 درجات على التيم كله. ولو باين إنك مش فاهم الكود: صفر.','لازم الإيميل المربوط بـ git هو نفس إيميل GitHub، وتعمل pull قبل push.','الـAI ممنوع في الـ16 فلتر. مسموح بس في البونص (فلتر 17 و18 وGUI) بشرط تفهمه وتعرف تعدله.','الميد القديم: UML وconstructors وoverloading وheap pointers وvirtual وكتابة كود inheritance (Ship مثلاً).'],
  path:['ابدأ يومك بـ 15 دقيقة «اتوقع الناتج» من تاب اختبر نفسك قبل أي كود.','اكتب بإيدك class صغير كل يوم (Student مثلاً) بدون نسخ.','Set 4 ثم 5 ثم 6: لكل set اكتب 5 جمل بكلامك عن اللي اتعلمته.','حل Lab sheets وQuiz prep من الدرايف، وميد 2025 Retake.'],
  rescue:[
   ['struct vs class','في C++ الاتنين شبه بعض، والفرق الوحيد إن الـmembers في struct هي public افتراضياً وفي class هي private. بنستخدم class لما عايزين نخفي البيانات ونتحكم فيها.'],
   ['Pointers','المؤشر بيخزن عنوان. <bdi class="f">&x</bdi> هو عنوان x، و<bdi class="f">*p</bdi> القيمة اللي عند العنوان. لو p بيشاور على struct: <bdi class="f">p->member</bdi>. اسم الـarray بيتحول لمؤشر لأول عنصر.'],
   ['Pass by value و by reference','By value بتتعمل نسخة والأصل مبيتغيرش. By reference (<bdi class="f">int &x</bdi>) الدالة بتشتغل على الأصل نفسه. للكبير اللي مش هيتعدل: <bdi class="f">const T &x</bdi>. ده سبب إن فلاترك بتاخد <bdi class="f">Image &img</bdi>.'],
   ['Dynamic memory','<bdi class="f">new</bdi> بيحجز في الـheap و<bdi class="f">delete</bdi> بيحرر. لو نسيت delete بيحصل memory leak. الـsmart pointers بتحرر لوحدها.'],
   ['Smart pointers','unique_ptr: مالك واحد بس. shared_ptr: أكتر من مالك ومعدّاد مراجع، وبيتحرر لما آخر واحد يخلص. weak_ptr: مرجع من غير ملكية. الفكرة اسمها RAII.'],
   ['IEEE 754','float: bit للإشارة + 8 للـexponent (bias = 127) + 23 للـmantissa. double: 1 + 11 (bias = 1023) + 52. عشان كده أرقام زي 0.1 مبتتخزنش بالظبط.'],
   ['خصائص OO السبعة','Identity (كل كائن ليه هوية)، Classification (نفس الخواص = class)، Abstraction (تركّز على المهم للتطبيق)، Encapsulation (إخفاء البيانات والتنفيذ ورا واجهة public)، Inheritance (is-a)، Polymorphism (نفس العملية بسلوك مختلف)، Genericity (templates).'],
   ['Inheritance (Set 6)','<bdi class="f">class Child : public Base</bdi>. public يظهر للكل، protected للـclass وأولاده، private للـclass بس. الـbase default constructor دايماً بيتنادى، ولو عايز غيره: <bdi class="f">Child(args) : Base(args)</bdi>. Overriding = نفس الـsignature في الأب والابن. is-a = ورث، has-a = association (member جوا الـclass).'],
   ['Separate compilation','header (.h/.hpp) فيه الإعلانات، وملف .cpp فيه التنفيذ، وملف main بيعمل <bdi class="f">#include "X.hpp"</bdi>. الـheader مبيتعملوش compile لوحده. include guards: <bdi class="f">#ifndef _X_HPP</bdi> / <bdi class="f">#define _X_HPP</bdi> / <bdi class="f">#endif</bdi> أو <bdi class="f">#pragma once</bdi>.'],
   ['Git في 6 أوامر','<bdi class="f">git clone URL</bdi> تنزّل المشروع · <bdi class="f">git pull</bdi> تجيب آخر تعديلات · <bdi class="f">git status</bdi> تشوف اللي اتغير · <bdi class="f">git add .</bdi> تجهّز · <bdi class="f">git commit -m "msg"</bdi> تحفظ · <bdi class="f">git push</bdi> ترفع. دايماً pull قبل push.']],
  quiz:[
   ['إيه الفرق الوحيد بين struct و class في C++؟','الـaccess الافتراضي: public في struct وprivate في class.'],
   ['ليه الفلتر بياخد Image &img مش Image img؟','عشان الدالة تعدّل الصورة الأصلية. من غير & هتتعدل نسخة وتتمسح.'],
   ['إيه اللي بيحصل لو عملت new ونسيت delete؟','Memory leak: الذاكرة محجوزة ومحدش بيحررها.'],
   ['إيه الفرق بين unique_ptr و shared_ptr؟','unique_ptr مالك واحد ومينفعش يتنسخ. shared_ptr أكتر من مالك بعدّاد مراجع، والذاكرة بتتحرر لما العدّاد يوصل صفر.'],
   ['ليه 0.1 مبتتخزنش بالظبط في float؟','لأنها كسر ثنائي لا نهائي، والـmantissa محدودة (23 bit في float).'],
   ['ليه الـencapsulation مفيد؟','بتحمي البيانات من تعديل غلط (validation) وبتسمح تغيّر التنفيذ الداخلي من غير ما تكسر الكود اللي بيستخدم الـclass.'],
   ['اتوقع الناتج:\nclass A{public: A(){cout<<"A ";} ~A(){cout<<"~A ";}};\nclass B:public A{public: B(){cout<<"B ";} ~B(){cout<<"~B ";}};\nint main(){ B b; }','A B ~B ~A\nالـconstructors من الأب للابن، والـdestructors بالعكس.','drill'],
   ['اتوقع الناتج:\nvoid f(int x){x=5;}\nvoid g(int &x){x=5;}\nint a=1,b=1; f(a); g(b); cout<<a<<b;','15\nf بتعدّل نسخة (a فاضلة 1)، وg بتعدّل الأصل (b بقت 5).','drill'],
   ['اتوقع الناتج:\nclass S{public: virtual void p(){cout<<"S";}};\nclass T:public S{public: void p(){cout<<"T";}};\nS* x = new T; x->p();','T\nلأن p virtual فالاختيار بيتم على نوع الكائن الفعلي. من غير virtual كان هيطلع S.','drill'],
   ['اتوقع الناتج:\nint a[3]={10,20,30}; int* p=a;\ncout<<*(p+2)<<p[1];','3020\n*(p+2) هو a[2] = 30، وp[1] هو a[1] = 20.','drill'],
   ['إيه اللي هيحصل:\nstruct P{int x;}; class Q{int x;};\nP p; p.x=1;\nQ q; q.x=1;','السطر الأول شغال، والتاني compile error لأن x في class هي private افتراضياً.','drill'],
   ['اتوقع الناتج:\nclass A{public: A(){cout<<"A:def ";} A(int a){cout<<"A:par ";}};\nclass C:public A{public: C(int a):A(a){cout<<"C";}};\nC t(1);','A:par C\nلأن C نادت constructor الأب اللي بياخد int في الـinitializer list.','drill'],
   ['ميد Retake: class CruiseShip ترث Ship. عايز toString() تتعدّل عند الابن وتتنادى من مؤشر Ship*. إيه المطلوب في الأب؟','تعريف toString في Ship بكلمة virtual، وفي الابن override (أو نفس الـsignature). وبعدين نخزن الكائنات في مصفوفة Ship* ونعمل delete في الآخر.','exam']],

let parts=[], raf=0;
function confetti(x,y,n){
  if(reduce) return;
  const cv=$('#confetti'), cx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#FFC21A','#3563FF','#E8458F','#12B886','#F5791B','#8B5CF6'];
  const ox=x==null?innerWidth/2:x, oy=y==null?innerHeight/3:y; n=n||36;
  for(let i=0;i<n;i++) parts.push({x:ox,y:oy,vx:(Math.random()-.5)*9,vy:Math.random()*-9-2,w:4+Math.random()*5,h:7+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],l:0});
  if(raf) return;
  const step=()=>{ cx.clearRect(0,0,cv.width,cv.height); parts.forEach(p=>{ p.vy+=.3; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.l++; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.globalAlpha=Math.max(0,1-p.l/80); cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); }); parts=parts.filter(p=>p.l<80); if(parts.length) raf=requestAnimationFrame(step); else { raf=0; cx.clearRect(0,0,cv.width,cv.height);} };
  raf=requestAnimationFrame(step);
}

/* ---------- theme (with circular reveal) ---------- */
function applyTheme(){ const el=document.documentElement; if(S.theme==='auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme',S.theme); }
function currentIsDark(){ return S.theme==='auto'?matchMedia('(prefers-color-scheme: dark)').matches:S.theme==='dark'; }
function setTheme(next,x,y){
  const apply=()=>{ S.theme=next; applyTheme(); save(); };
  const root=document.documentElement;
  if(!document.startViewTransition||reduce){ root.classList.add('theme-fade'); apply(); setTimeout(()=>root.classList.remove('theme-fade'),800); return; }
  try{
    const t=document.startViewTransition(apply);
    t.ready.then(()=>{
      const r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
      root.animate({clipPath:['circle(0px at '+x+'px '+y+'px)','circle('+r+'px at '+x+'px '+y+'px)']},{duration:750,easing:'cubic-bezier(.22,.9,.3,1)',pseudoElement:'::view-transition-new(root)'});
    }).catch(()=>{});
  }catch(e){ root.classList.add('theme-fade'); apply(); setTimeout(()=>root.classList.remove('theme-fade'),800); }
}

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h; }
/* ---------- stable ids: PERSONAL keeps the legacy index ids; PUBLIC (ID_HASH=true) derives an id from the row text so inserting rows never shifts progress. ID_ALIAS keeps old progress when a row text is corrected ---------- */
const ID_HASH=true;
const SIDC={};
function sidAt(kind,u,i,arr,txt,legacy){

  if(!m||m.n!==arr.length){ m={n:arr.length,ids:[]}; const used={}; arr.forEach((r,j)=>{ let id=(ID_ALIAS[kind+':'+u+':'+hashStr(txt(r)).toString(36)]||hashStr(txt(r)).toString(36)); if(used[id]){ used[id]++; id+='_'+used[id]; } else used[id]=1; m.ids[j]=kind+':'+u+':'+id; }); SIDC[k]=m; }

const ID_ALIAS={};   /* optional: {'q:math:oldhash':'stableName'} when a typo in a row must not reset progress */

  const rem=GPA.map(u=>({u,r:progress(u).n-progress(u).d})).filter(x=>x.r>0).sort((a,b)=>b.r-a.r);
  if(rem.length){ const x=pick(rem.slice(0,3)); out.push(SUBJ[x.u].n+': لسه '+x.r+' موضوع مش «فهمته». خد واحد منهم النهارده.'); }
  const st=streak(); out.push(st>=2?st+' يوم ورا بعض. ماتكسرش السلسلة.':'ابدأ سلسلة جديدة النهارده، يوم واحد بيكفي كبداية.');
  const oh=Math.round((OOP_DUE-now)/36e5); if(oh>0&&oh<96) out.push('باقي '+oh+' ساعة على تسليم OOP Part 2. لو لسه ما خلصتش، ابدأ دلوقتي وقسّم الشغل مع التيم.');

function timeLines(){ const h=now_h(); return h<5?PH_TIME.night:h<12?PH_TIME.morning:h<16?PH_TIME.noon:h<20?PH_TIME.eve:PH_TIME.night; }
const now_h = () => new Date().getHours();
function genPhrase(){
  let s='', tries=0;
  do{
    const r=Math.random();
    if(r<.22) s=pick(ctxLines());
    else if(r<.34) s=pick(timeLines());
    else s=pick(PH.open)+' '+pick(PH.core)+' '+pick(PH.act);
    tries++;
  }while(S.seen.includes(hashStr(s))&&tries<12);
  S.seen.push(hashStr(s)); if(S.seen.length>80) S.seen.shift();
  return s;
}

const WX={lat:30.0262,lon:31.2088,data:null};
function wxKind(c,day){
  if(c===0) return day?'sun':'clear';
  if(c<=2) return day?'partly':'cloudy-night';
  if(c===3) return 'cloud';
  if(c===45||c===48) return 'fog';
  if(c>=51&&c<=67||c>=80&&c<=82) return 'rain';
  if(c>=71&&c<=77||c===85||c===86) return 'snow';
  if(c>=95) return 'storm';
  return 'cloud';
}

const WXDIAG={err:'',last:0};
async function wxFetchOM(ms){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+WX.lat+'&longitude='+WX.lon+'&current=temperature_2m,weather_code,is_day&timezone=Africa%2FCairo',{signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json(), c=j&&j.current; if(!c) throw new Error('no data');
    return {temp:c.temperature_2m,code:c.weather_code,day:c.is_day===1,src:'net'};
  } finally { clearTimeout(to); }
}
/* second provider (wttr.in, WWO codes mapped to WMO) in case the first one is blocked or rate-limited on the viewer's network */
function wxWwo(c){ c=+c; if(c===113) return 0; if(c===116) return 2; if(c===119||c===122) return 3; if([143,248,260].indexOf(c)>=0) return 45; if([200,386,389,392,395].indexOf(c)>=0) return 95; if([179,227,230,323,326,329,332,335,338,368,371].indexOf(c)>=0) return 71; return 61; }
async function wxFetchWttr(ms){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),ms);

    const r=await fetch('https://wttr.in/'+WX.lat+','+WX.lon+'?format=j1',{signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json(), c=j&&j.current_condition&&j.current_condition[0]; if(!c) throw new Error('no data');

async function loadWeather(force){
  let stale=null;
  try{ const c=JSON.parse(localStorage.getItem('tm-wx')||'null'); if(c){ stale=c; if(!force&&Date.now()-c.t<30*60*1000){ wxApply(c.d); return; } } }catch(e){}
  WXDIAG.last=Date.now();
  const tries=!ID_HASH?[['om',6000]]:[['om',8000],['wttr',9000],['om',12000]];
  for(const t of tries){
    try{
      const d=t[0]==='om'?await wxFetchOM(t[1]):await wxFetchWttr(t[1]);
      try{ localStorage.setItem('tm-wx',JSON.stringify({t:Date.now(),d})); }catch(e){}
      WXDIAG.err=''; wxApply(d); return;
    }catch(e){ WXDIAG.err=t[0]+': '+(e&&e.name==='AbortError'?'timeout':(e&&e.message)||'error'); }
  }
  if(stale&&Date.now()-stale.t<12*3600*1000) wxApply(stale.d);

/* ---------- ambience: quiet synthesised rain / wind / thunder + lightning flashes ---------- */
let WXK='', WXA=null, WXLT=null, WXGESTURE=false;
function wxNoiseBuf(a){ const n=a.sampleRate*2, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b; }
let WXBT=null;
function wxAmbStop(){ clearTimeout(WXBT); if(WXA){ try{ WXA.g.gain.setTargetAtTime(0,WXA.a.currentTime,.4); const s=WXA.src; setTimeout(()=>{ try{ s.stop(); }catch(e){} },1500); }catch(e){} WXA=null; } }
function wxAmbStart(){
  wxAmbStop(); if(!S.wxsnd||!S.sound) return;
  const cfg={rain:[700,4800,.02],storm:[600,4200,.03],fog:[80,500,.012],cloud:[80,700,.009],partly:[80,700,.006],sun:[80,600,.005],clear:[80,500,.004],'cloudy-night':[80,500,.005]}[WXK]; wxCritters(); if(!cfg) return;
  const a=ac(); if(!a) return;
  const src=a.createBufferSource(); src.buffer=wxNoiseBuf(a); src.loop=true;
  const hp=a.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=cfg[0];
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=cfg[1];
  const g=a.createGain(); g.gain.value=0; g.gain.setTargetAtTime(cfg[2],a.currentTime,1.2);
  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(a.destination); src.start();
  WXA={a,src,g};
}
function wxThunder(){
  if(!S.wxsnd||!S.sound) return; const a=ac(); if(!a) return;
  const src=a.createBufferSource(); src.buffer=wxNoiseBuf(a);
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(260,a.currentTime); lp.frequency.exponentialRampToValueAtTime(70,a.currentTime+2.5);
  const g=a.createGain(); const t=a.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.4,t+.12); g.gain.exponentialRampToValueAtTime(.001,t+3.2);
  src.connect(lp); lp.connect(g); g.connect(a.destination); src.start(t); src.stop(t+3.3);
}
function wxLightning(){

/* soft birds by day, crickets by night; very quiet */
function wxBlip(a,t,f0,f1,dur,peak){
  const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+dur*.25); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function wxCritters(){
  clearTimeout(WXBT); if(!S.wxsnd||!S.sound) return;
  const day=WXK==='sun'||WXK==='partly', night=WXK==='clear'||WXK==='cloudy-night'; if(!day&&!night) return;
  const step=()=>{
    if(document.hidden||!S.wxsnd||!S.sound||(WXK!=='sun'&&WXK!=='partly'&&WXK!=='clear'&&WXK!=='cloudy-night')) return;
    const a=ac(); if(a){ const t=a.currentTime+.05;
      if(day){ const n=2+Math.floor(Math.random()*4), base=2600+Math.random()*1800; for(let i=0;i<n;i++) wxBlip(a,t+i*.11,base+Math.random()*500,base*(Math.random()>.5?1.35:.8),.09,.018); }
      else { for(let i=0;i<3;i++) wxBlip(a,t+i*.07,4300,4200,.05,.006); }
    }
    WXBT=setTimeout(step,(day?2200:1100)+Math.random()*(day?5000:1800));
  };
  WXBT=setTimeout(step,800);
}

/* =====================================================================
   QUIZ ENGINE: MCQ (static bank + number generators) + essay (reveal answer)
   Everything is synchronous, so "next" never waits.
   ===================================================================== */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; };
const rd=(x,d)=>{ d=d==null?2:d; const p=Math.pow(10,d); return String(Math.round(x*p)/p); };
function mkq(q,right,wrongs,e,extra){
  const seen=new Set([String(right)]), w=[];
  for(const x of wrongs){ const s=String(x); if(!seen.has(s)){ seen.add(s); w.push(s); } }
  if(w.length<3&&isFinite(+right)&&String(right).trim()!==''){ const n0=+right, isInt=Number.isInteger(n0); [n0+1,n0-1,n0+2,n0-2,n0*2,Math.floor(n0/2)+1].forEach(c=>{ const s=isInt?String(Math.round(c)):rd(c); if(w.length<3&&c>=0&&!seen.has(s)){ seen.add(s); w.push(s); } }); }
  const opts=shuf([String(right)].concat(w.slice(0,3)));
  return Object.assign({t:'mcq',q:q,o:opts,a:opts.indexOf(String(right)),e:e||''},extra||{});
}

  const rx=TOPIC_RX[u]; if(!rx||!SUBJ[u].topics.length) return true;
  if(TOPIC_HARD[u]&&TOPIC_HARD[u].test(text)) return false;
